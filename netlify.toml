# Netlify: אתר סטטי מתוך public/ + Function אחת ל-/api/*. ראו docs/DEPLOYMENT.md.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["lib/**"]

# נתיבי "קישורים יפים" – שכתוב (200) ולא הפניה, כדי שהכתובת תישאר זהה
[[redirects]]
  from = "/b/*"
  to = "/book.html"
  status = 200
[[redirects]]
  from = "/l/*"
  to = "/lead.html"
  status = 200
[[redirects]]
  from = "/m/*"
  to = "/manage.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# עמודי ניהול וקישור אישי: ללא אינדוקס וללא מטמון
[[headers]]
  for = "/m/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
